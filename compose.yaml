services:
  zos-upload:
    build:
      context: .
      target: runtime
    image: "zos-upload-service:${IMAGE_TAG:-1.0.0}"
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${LISTEN_PORT:-8000}:8000"
    volumes:
      - zos-database:/data/db
      - zos-temporary:/data/tmp
    stop_grace_period: 10m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zos-database:
  zos-temporary:
